<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signalen achter de voordeur – meldformulier (prototype)</title>
<style>
:root{--red:#d6001c;--red-soft:#fdecee;--ink:#1d1d1f;--muted:#6b6b70;--line:#d9d9de;--bg:#f2f2f4;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.proto{background:#fff6d6;color:#5a4a00;font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #f0e2a8}
header{background:#fff;padding:14px 16px 0;border-bottom:3px solid var(--red)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:800;color:var(--red);letter-spacing:.5px;font-size:15px;line-height:1.05}
.brand small{display:block;color:var(--muted);font-weight:400;letter-spacing:0;font-size:12px;margin-top:2px}
select.lang{border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:14px;background:#fff}
.step{font-size:13px;color:var(--muted);margin:12px 0 6px}
.bar{height:6px;background:#e6e6ea;border-radius:3px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transition:width .25s}
main{padding:16px;flex:1}
h1{color:var(--red);font-size:24px;margin:4px 0 6px}
h2{font-size:19px;margin:0 0 4px}
.lead{margin:0 0 14px;color:#333}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
label.f{display:block;font-size:14px;margin:10px 0 4px}
label.f b{color:var(--red)}
input[type=text],input[type=date],textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;font-family:inherit}
textarea{min-height:84px;resize:vertical}
.opt{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:8px;padding:12px;margin-top:8px;cursor:pointer;background:#fff}
.opt input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--red);flex:none}
.opt.on{border-color:var(--red);background:var(--red-soft)}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px;margin-top:8px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:11px 4px;font-size:15px;cursor:pointer;font-family:inherit}
.seg button.on{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:700}
.q{margin-top:14px;font-size:15px}
.alert{background:var(--red);color:#fff;border-radius:8px;padding:12px;margin-top:10px;font-weight:700}
.err{color:var(--red);font-size:13px;margin-top:6px;display:none}
.err.show{display:block}
.grp{border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;cursor:pointer;background:#fff}
.grp.on{border-color:var(--red);background:var(--red-soft)}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pics img{width:100%;border-radius:4px;display:block}
.grp .lbl{display:flex;align-items:center;gap:10px;margin-top:8px}
.grp .lbl input{width:20px;height:20px;accent-color:var(--red)}
.grp .lbl small{display:block;color:var(--muted)}
.src{font-size:11px;color:var(--muted);margin-top:8px}
.hidden{display:none}
footer{display:flex;gap:10px;padding:14px 16px 22px;background:#fff;border-top:1px solid var(--line)}
footer button{flex:1;border-radius:8px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
.prim{background:var(--red);color:#fff;border:0}
.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);flex:0 0 34%!important;font-weight:400!important}
.done{text-align:center;padding-top:30px}
.check{width:72px;height:72px;border-radius:50%;background:var(--red);color:#fff;font-size:40px;line-height:72px;margin:0 auto 16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="proto" data-t="proto"></div>
  <header>
    <div class="top">
      <div class="brand">EIGEN HAARD<small>Zorg &amp; Overlast</small></div>
      <select class="lang" id="lang" aria-label="Taal / Language">
        <option value="nl">🇳🇱 Nederlands</option>
        <option value="en">🇬🇧 English</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="pl">🇵🇱 Polski</option>
      </select>
    </div>
    <div class="step" id="stepTxt"></div>
    <div class="bar"><i id="barFill"></i></div>
  </header>

  <main>
    <!-- STAP 1 -->
    <section id="s1">
      <h1 data-t="title"></h1>
      <p class="lead" data-t="intro"></p>
      <div class="card">
        <h2 data-t="asTitle"></h2>
        <div class="seg" style="--n:2" data-name="as">
          <button type="button" data-v="vakman" data-t="asVak"></button>
          <button type="button" data-v="werkorganisator" data-t="asWo"></button>
        </div>
        <div class="err" id="eAs" data-t="req"></div>
      </div>
      <div class="card">
        <h2 data-t="home"></h2>
        <label class="f"><span data-t="addr"></span> <b>*</b></label>
        <input type="text" id="addr" data-ph="addrPh">
        <div class="err" id="eAddr" data-t="req"></div>
        <label class="f"><span data-t="city"></span> <b>*</b></label>
        <input type="text" id="city" data-ph="cityPh">
        <div class="err" id="eCity" data-t="req"></div>
        <label class="f" data-t="date"></label>
        <input type="date" id="date">
      </div>
      <div class="card">
        <h2 data-t="worry"></h2>
        <p class="hint" data-t="multi"></p>
        <label class="opt"><input type="checkbox" name="worry" value="vol"><span data-t="wVol"></span></label>
        <label class="opt"><input type="checkbox" name="worry" value="vies"><span data-t="wVies"></span></label>
        <label class="opt"><input type="checkbox" name="worry" value="anders"><span data-t="wAnders"></span></label>
        <input type="text" id="andersTxt" class="hidden" style="margin-top:8px" data-ph="andersPh">
        <div class="err" id="eWorry" data-t="reqOne"></div>
      </div>
      <div class="card">
        <h2 data-t="danger"></h2>
        <div class="seg" style="--n:2" data-name="danger">
          <button type="button" data-v="ja" data-t="yes"></button>
          <button type="button" data-v="nee" data-t="no"></button>
        </div>
        <div class="alert hidden" id="dangerAlert" data-t="call112"></div>
        <div class="err" id="eDanger" data-t="req"></div>
      </div>
    </section>

    <!-- STAP 2 -->
    <section id="s2" class="hidden">
      <h2 style="font-size:22px" data-t="howFull"></h2>
      <p class="hint" data-t="howFullHint"></p>
      <div class="grp" data-v="1-2"><div class="pics"><img data-img="cir1" alt="CIR 1"><img data-img="cir2" alt="CIR 2"></div>
        <div class="lbl"><input type="radio" name="full"><div><b data-t="g1"></b><small data-t="g1s"></small></div></div></div>
      <div class="grp" data-v="3-6"><div class="pics"><img data-img="cir3" alt="CIR 3"><img data-img="cir5" alt="CIR 5"></div>
        <div class="lbl"><input type="radio" name="full"><div><b data-t="g2"></b><small data-t="g2s"></small></div></div></div>
      <div class="grp" data-v="7-9"><div class="pics"><img data-img="cir7" alt="CIR 7"><img data-img="cir9" alt="CIR 9"></div>
        <div class="lbl"><input type="radio" name="full"><div><b data-t="g3"></b><small data-t="g3s"></small></div></div></div>
      <div class="grp" data-v="onbekend"><div class="lbl" style="margin-top:0"><input type="radio" name="full"><b data-t="g4" style="font-weight:400"></b></div></div>
      <div class="err" id="eFull" data-t="req"></div>
      <p class="src">Foto’s: Clutter Image Rating Scale, Frost et al. (2008)</p>
    </section>

    <!-- STAP 3 -->
    <section id="s3" class="hidden">
      <div class="card">
        <h2 data-t="saw"></h2>
        <p class="hint" data-t="multi"></p>
        <label class="opt"><input type="checkbox"><span data-t="saw1"></span></label>
        <label class="opt"><input type="checkbox"><span data-t="saw2"></span></label>
        <label class="opt"><input type="checkbox"><span data-t="saw3"></span></label>
        <label class="opt"><input type="checkbox"><span data-t="saw4"></span></label>
        <label class="opt"><input type="checkbox"><span data-t="saw5"></span></label>
        <label class="opt"><input type="checkbox"><span data-t="saw6"></span></label>
        <label class="opt"><input type="checkbox"><span data-t="saw7"></span></label>
      </div>
      <div class="card">
        <h2 data-t="before"></h2>
        <div class="seg" style="--n:2" data-name="before">
          <button type="button" data-v="ja" data-t="yes"></button>
          <button type="button" data-v="nee" data-t="no"></button>
        </div>
        <div id="changeBox" class="hidden">
          <div class="q" data-t="change"></div>
          <div class="seg" data-name="change">
            <button type="button" data-v="erger" data-t="worse"></button>
            <button type="button" data-v="nee" data-t="no"></button>
            <button type="button" data-v="wn" data-t="dk"></button>
          </div>
        </div>
        <div class="q" data-t="neighbours"></div>
        <div class="seg" data-name="neighbours">
          <button type="button" data-v="ja" data-t="yes"></button>
          <button type="button" data-v="nee" data-t="no"></button>
          <button type="button" data-v="wn" data-t="dk"></button>
        </div>
      </div>
    </section>

    <!-- STAP 4 -->
    <section id="s4" class="hidden">
      <div class="card">
        <h2 data-t="desc"></h2>
        <p class="hint" data-t="descHint"></p>
        <textarea id="desc"></textarea>
      </div>
      <div class="card">
        <h2 data-t="rem"></h2>
        <p class="hint" data-t="remHint"></p>
        <textarea id="rem" style="min-height:60px"></textarea>
      </div>
      <div class="card">
        <h2 data-t="you"></h2>
        <label class="f" data-t="name"></label><input type="text" id="name">
        <label class="f" data-t="org"></label><input type="text" id="org">
        <label class="f"><span data-t="contact"></span> <b>*</b></label><input type="text" id="contact">
        <div class="err" id="eContact" data-t="reqContact"></div>
        <label class="opt" style="margin-top:14px"><input type="checkbox" id="anon"><span data-t="anon"></span></label>
      </div>
      <p class="hint" data-t="testNote"></p>
    </section>

    <!-- BEVESTIGING -->
    <section id="s5" class="hidden done">
      <div class="check">✓</div>
      <h1 data-t="sent"></h1>
      <p data-t="sentTxt"></p>
      <p class="hint" style="margin-top:18px" data-t="protoDone"></p>
    </section>
  </main>

  <footer id="nav">
    <button class="sec hidden" id="back" data-t="back"></button>
    <button class="prim" id="next" data-t="next"></button>
  </footer>
</div>

let lang=(new URLSearchParams(location.search).get('lang'))||'nl'; if(!T[lang]) lang='nl';

  if(g.dataset.name==='danger') $('#dangerAlert').classList.toggle('hidden',b.dataset.v!=='ja');

}));
$$('.opt input').forEach(i=>i.onchange=()=>{i.closest('.opt').classList.toggle('on',i.checked);

$$('.grp').forEach(g=>g.onclick=()=>{$$('.grp').forEach(x=>{x.classList.remove('on');x.querySelector('input').checked=false});
  g.classList.add('on');g.querySelector('input').checked=true;st.full=g.dataset.v;});
const worries=()=>$$('input[name=worry]:checked').map(i=>i.value);

function err(id,show){$(id).classList.toggle('show',show);return !show}
function valid(){
  if(step===1){let ok=true;

    ok=err('#eWorry',worries().length===0)&&ok; ok=err('#eDanger',!st.danger)&&ok; return ok;}
  if(step===2) return err('#eFull',!st.full);
  if(step===4) return err('#eContact',!$('#contact').value.trim());
  return true;}
function render(){const t=T[lang];
  [1,2,3,4,5].forEach(n=>$('#s'+n).classList.toggle('hidden',n!==step));
  $('#stepTxt').textContent=step<5?t.step.replace('{n}',step):'';
  $('#barFill').style.width=(Math.min(step,4)/4*100)+'%';

  $('#next').textContent=step===4?t.send:step===5?t.again:t.next;
  window.scrollTo(0,0);}
function collect(){const v=s=>($(s)||{}).value||'';

$('#next').onclick=()=>{ if(step===5){location.reload();return}

  if(step===1) step=needFull()?2:3; else step++; render();};
$('#back').onclick=()=>{ if(step===3) step=needFull()?2:1; else step--; render();};
